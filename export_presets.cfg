[preset.0]
name="Web PWA"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="node_modules/*,cloudflare/*,tools/*,package*.json,wrangler.jsonc,assets/photos/*,tests/*,build/*,README.md,assets/png/*,assets/components/*.svg,assets/animations/*-0.png,assets/animations/*-1.png,assets/animations/*-2.png,assets/animations/*-3.png,assets/animations/*.webp"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include="<meta name=\"description\" content=\"60 secondes pour chasser les monstres du bureau.\">"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144="res://assets/pwa/icon-192.png"
progressive_web_app/icon_180x180="res://assets/pwa/icon-180.png"
progressive_web_app/icon_512x512="res://assets/pwa/icon-512.png"
progressive_web_app/background_color=Color(0.065, 0.035, 0.10, 1)
