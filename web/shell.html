		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

:root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
html { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
	color: white;
	background-color: #11091a;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	position: absolute;
	left: 50%;
	top: 0;
	transform: translateX(-50%);
	width: min(100%, 768px);
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	top: 0;
	left: 50%;
	width: min(100%, 768px);
	height: 100%;
	transform: translateX(-50%);
	background: #11091a;
	overflow: hidden;
}
#splash-stage {
	position: absolute;
	left: 50%;
	top: 50%;
	width: 390px;
	height: 844px;
	transform: translate(-50%, -50%) scale(var(--splash-scale, 1));
	font-family: Arial, sans-serif;
}
#splash-art { position: absolute; top: 0; width: 390px; height: 443px; overflow: hidden; mask-image: linear-gradient(black 94%, transparent); }
.floating-ghost { animation: ghost-float 4.8s ease-in-out infinite; }
@keyframes ghost-float { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(6px); } 75% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .floating-ghost { animation: none; } }
#loading-label {
	position: absolute;
	top: 461px;
	width: 100%;
	text-align: center;
	color: #fff2d7;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: 2px;
}
#status-progress {
	position: absolute;
	top: 499px;
	left: 58px;
	width: 274px;
	height: 18px;
	appearance: none;
	border: 2px solid #76518d;
	border-radius: 20px;
	background: #241132;
	overflow: hidden;
}
#status-progress::-webkit-progress-bar { background: #241132; border-radius: 20px; }
#status-progress::-webkit-progress-value { background: linear-gradient(#ffd272, #ff821c); border-radius: 20px; }
#status-progress::-moz-progress-bar { background: linear-gradient(#ffd272, #ff821c); border-radius: 20px; }
#status-notice { display: none; position: absolute; bottom: 15%; }

#status-notice {
	display: none;
}


#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// Own the drawing buffer size so Godot cannot stretch it to the desktop window.
GODOT_CONFIG.canvasResizePolicy = 0;
const gameCanvas = document.getElementById('canvas');
function resizeGameCanvas() {
	const width = Math.min(768, document.documentElement.clientWidth);
	const height = Math.round(window.visualViewport?.height || window.innerHeight);
	const ratio = window.devicePixelRatio || 1;
	const overlay = document.getElementById('status');
	if (overlay) overlay.style.height = `${height}px`;
	document.documentElement.style.setProperty('--splash-scale', Math.min(width / 390, height / 844));
	gameCanvas.style.width = `${width}px`;
	gameCanvas.style.height = `${height}px`;
	const bufferWidth = Math.round(width * ratio);
	const bufferHeight = Math.round(height * ratio);
	if (gameCanvas.width !== bufferWidth) gameCanvas.width = bufferWidth;
	if (gameCanvas.height !== bufferHeight) gameCanvas.height = bufferHeight;
}
resizeGameCanvas();
window.addEventListener('resize', resizeGameCanvas);
window.visualViewport?.addEventListener('resize', resizeGameCanvas);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
